name: Ekstrak ZIP TGP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cari ZIP
        id: zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "❌ ZIP tidak ditemukan di root repository"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Ekstrak ZIP
        run: |
          ZIP="${{ steps.zip.outputs.file }}"

          mkdir -p extracted

          echo "📦 Mengekstrak $ZIP..."
          unzip -q -o "$ZIP" -d extracted

          echo "🔍 Mencari package.json..."

          PROJECT_DIR=$(find extracted \
            -name package.json \
            -not -path "*/node_modules/*" \
            -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "❌ package.json tidak ditemukan"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

          echo "✅ Project ditemukan:"
          echo "$PROJECT_DIR"

          echo "📂 Menyalin source TGP..."

          cp -r "$PROJECT_DIR"/. .

          rm -rf extracted

          echo "🗑️ Menghapus ZIP..."
          rm -f "$ZIP"

      - name: Verifikasi
        run: |
          echo "🔍 Verifikasi project..."

          test -f package.json
          test -d src

          echo "✅ package.json ditemukan"
          echo "✅ src ditemukan"
          echo "✅ TGP berhasil diekstrak"

      - name: Commit Hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Extract TGP source from ZIP"
          git push
